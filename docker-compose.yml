version: '3.8'

services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    container_name: pharmasync-dynamodb
    ports:
      - "8002:8000"  # Expose on host port 8002 to avoid conflict with backend on 8000
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmasync-backend
    ports:
      - "8000:8000"  # Map container port 8000 to host port 8000
    environment:
      - ENV=development
      - DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
      - DYNAMODB_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - INVENTORY_SYNC_SERVICE_URL=http://inventory-sync:8001
    depends_on:
      - dynamodb-local
    restart: always

  inventory-sync:
    build:
      context: ./backend/inventory_sync_service
      dockerfile: Dockerfile
    container_name: pharmasync-inventory-sync
    ports:
      - "8001:8001"  # Map microservice port 8001 to host port 8001
    restart: always
